<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI Platform</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; }
        
        .chat-card { width: 100%; max-width: 480px; height: 88vh; background: #1e293b; border-radius: 20px; border: 1px solid #334155; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6); }
        
        /* Header */
        .chat-header { padding: 16px 20px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 12px; }
        .avatar-ai { width: 42px; height: 42px; background: linear-gradient(135deg, #6366f1, #a855f7); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; color: white; box-shadow: 0 0 12px rgba(99, 102, 241, 0.4); }
        .header-info h2 { font-size: 16px; font-weight: 600; color: #f1f5f9; }
        .header-info span { font-size: 12px; color: #22c55e; display: flex; align-items: center; gap: 6px; }
        .header-info span::before { content: ''; width: 7px; height: 7px; background: #22c55e; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #22c55e; }

        /* Chat Body & Custom Blue Scrollbar */
        .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
        
        .chat-body::-webkit-scrollbar { width: 6px; }
        .chat-body::-webkit-scrollbar-track { background: #1e293b; }
        .chat-body::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 10px; }
        .chat-body::-webkit-scrollbar-thumb:hover { background: #0284c7; }

        /* Messages Layout & Slide-In Animations */
        .message-row { display: flex; flex-direction: column; max-width: 85%; opacity: 0; }
        
        .message-row.user { 
            align-self: flex-end; 
            animation: slideInRight 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .message-row.bot { 
            align-self: flex-start; 
            animation: slideInLeft 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideInRight {
            from { transform: translateX(35px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideInLeft {
            from { transform: translateX(-35px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .bubble { padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .user .bubble { background: #6366f1; color: white; border-bottom-right-radius: 4px; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2); }
        .bot .bubble { background: #334155; color: #f1f5f9; border-bottom-left-radius: 4px; border: 1px solid #475569; }

        .time { font-size: 10px; color: #94a3b8; margin-top: 4px; }
        .user .time { text-align: right; }

        /* Chips Suggestion */
        .chips-container { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; background: #0f172a; border-top: 1px solid #1e293b; }
        .chips-container::-webkit-scrollbar { height: 4px; }
        .chips-container::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 10px; }
        
        .chip { background: #1e293b; color: #38bdf8; border: 1px solid #0284c7; padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .chip:hover { background: #0284c7; color: white; transform: translateY(-1px); }

        /* Footer Input */
        .chat-footer { padding: 14px 16px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 10px; align-items: center; }
        .chat-footer input { flex: 1; background: #1e293b; border: 1px solid #334155; padding: 12px 18px; border-radius: 25px; color: white; outline: none; font-size: 14px; transition: 0.2s; }
        .chat-footer input:focus { border-color: #38bdf8; box-shadow: 0 0 8px rgba(56, 189, 248, 0.3); }
        .chat-footer button { background: #38bdf8; color: #0f172a; border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; transition: 0.2s; font-size: 15px; display: flex; align-items: center; justify-content: center; }
        .chat-footer button:hover { background: #0284c7; color: white; transform: scale(1.05); }

        /* Typing Indicator Animation */
        .typing { display: flex; gap: 4px; padding: 12px 16px; background: #334155; border-radius: 18px; width: fit-content; border-bottom-left-radius: 4px; }
        .dot { width: 7px; height: 7px; background: #38bdf8; border-radius: 50%; animation: blink 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes blink { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="chat-card">
        <div class="chat-header">
            <div class="avatar-ai"><i class="fa-solid fa-robot"></i></div>
            <div class="header-info">
                <h2>Nexus AI Engine</h2>
                <span>Online (Gemini 3.6)</span>
            </div>
        </div>

        <div class="chat-body" id="chatBody">
            <div class="message-row bot">
                <div class="bubble">Halo! Ada yang bisa saya bantu hari ini?</div>
                <div class="time" id="initTime"></div>
            </div>
        </div>

        <div class="chips-container">
            <div class="chip" onclick="sendChip('Perbedaan SSD dan HDD')"> SSD vs HDD</div>
            <div class="chip" onclick="sendChip('Buatkan contoh script Python Flask')">💻 Script Flask</div>
            <div class="chip" onclick="sendChip('Apa bedanya HTTP dan HTTPS?')">🔒 HTTP vs HTTPS</div>
        </div>

        <form class="chat-footer" id="chatForm">
            <input type="text" id="userInput" placeholder="Tanyakan sesuatu..." autocomplete="off" required>
            <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
    </div>

    <script>
    const chatBody = document.getElementById('chatBody');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');

    function getTime() {
        const now = new Date();
        return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    document.getElementById('initTime').innerText = getTime();

    function createMessageElement(sender) {
        const row = document.createElement('div');
        row.className = `message-row ${sender}`;
        
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        
        const time = document.createElement('div');
        time.className = 'time';
        time.innerText = getTime();

        row.appendChild(bubble);
        row.appendChild(time);
        chatBody.appendChild(row);
        chatBody.scrollTop = chatBody.scrollHeight;
        
        return bubble;
    }

    function showTyping() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message-row bot';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerHTML = `
            <div class="typing">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        `;
        chatBody.appendChild(typingDiv);
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    function removeTyping() {
        const typingIndicator = document.getElementById('typingIndicator');
        if (typingIndicator) typingIndicator.remove();
    }

    function sendChip(text) {
        userInput.value = text;
        chatForm.dispatchEvent(new Event('submit'));
    }

    chatForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        const msg = userInput.value.trim();
        if (!msg) return;

        const userBubble = createMessageElement('user');
        userBubble.innerText = msg;
        userInput.value = '';

        showTyping();

        try {
            const response = await fetch('/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ msg: msg })
            });

            removeTyping();

            const botBubble = createMessageElement('bot');
            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            // Sistem Antrean untuk Efek Ketik Halus
            let queue = [];
            let isTyping = false;

            function typeNextChar() {
                if (queue.length > 0) {
                    isTyping = true;
                    botBubble.innerText += queue.shift();
                    chatBody.scrollTop = chatBody.scrollHeight;
                    
                    // 👇 UBAH ANGKA INI 👇
                    // Ganti '15' menjadi '5' biar ngebut parah.
                    // Atau ganti '1' biar hampir instan.
                    setTimeout(typeNextChar, 5); // <--- Ubah di sini
                } else {
                    isTyping = false;
                }
            }

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                
                // Masukkan tiap karakter dari chunk ke dalam antrean
                for (let char of chunk) {
                    queue.push(char);
                }

                // Jalankan efek pengetikan jika belum berjalan
                if (!isTyping) {
                    typeNextChar();
                }
            }

        } catch (err) {
            removeTyping();
            const errorBubble = createMessageElement('bot');
            errorBubble.innerText = '⚠️ Terjadi kesalahan koneksi ke server.';
        }
    });
</script>
</body>
</html>
